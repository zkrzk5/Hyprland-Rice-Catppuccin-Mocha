# --- General Settings ---
general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
}

# --- Background ---
background {
    monitor =
    path = screenshot # Takes a screenshot of your current desktop
    color = $base
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# --- Time ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $mauve
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# --- Date ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $subtext1
    font_size = 18
    font_family = JetBrainsMono Nerd Font, Noto Sans
    position = 0, 15
    halign = center
    valign = center
}

# --- User Prompt ---
label {
    monitor =
    text = ❯ $USER ❮
    color = $subtext0
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

# --- Password Input Box ---
input-field {
    monitor =
    size = 250, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true
    
    outer_color = $surface1
    inner_color = $surface0
    font_color = $subtext1
    check_color = $mauve
    fail_color = $red
    capslock_color = $yellow

    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">password...</span>
    hide_input = false
    
    position = 0, -120
    halign = center
    valign = center
}